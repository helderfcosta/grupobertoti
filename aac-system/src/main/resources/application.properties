spring.application.name=aac-system

# ---- Ollama (geração das palavras) ----
ollama.url=http://localhost:11434/api/generate

# ---- Imagens: ARASAAC (fonte principal) ----
arasaac.api.url=https://api.arasaac.org/v1/pictograms/pt/search/
arasaac.imagem.url=https://static.arasaac.org/pictograms/%d/%d_500.png

# Pasta do cache (ids e imagens). Relativa à pasta de onde o programa é executado.
cache.dir=./cache

# ---- Imagens: IA local (stable-diffusion.cpp) - DESLIGADA por padrão ----
# Para ligar: coloque sd.enabled=true e ajuste os dois caminhos abaixo.
sd.enabled=true
sd.exe=C:/AAC-Board-AI/models/stable-diffusion-1.5/sd-cli.exe
sd.model=C:/AAC-Board-AI/models/stable-diffusion-1.5/stable-diffusion-v1-5-pruned-emaonly-Q8_0.gguf
sd.steps=15
sd.cfg-scale=
sd.timeout-seconds=240
